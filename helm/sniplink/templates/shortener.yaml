apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sniplink.fullname" . }}-shortener
  labels:
    {{- include "sniplink.labels" . | nindent 4 }}
    app.kubernetes.io/component: shortener
spec:
  {{- if not .Values.shortener.autoscaling.enabled }}
  replicas: {{ .Values.shortener.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sniplink.name" . }}-shortener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sniplink.name" . }}-shortener
        app.kubernetes.io/component: shortener
    spec:
      containers:
        - name: shortener
          image: "{{ .Values.shortener.image.repository }}:{{ .Values.shortener.image.tag }}"
          imagePullPolicy: {{ .Values.shortener.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.shortener.service.port }}
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sniplink.fullname" . }}-config
                  key: PORT_SHORTENER
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sniplink.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sniplink.fullname" . }}-config
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sniplink.fullname" . }}-config
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sniplink.fullname" . }}-config
                  key: PGDATABASE
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "sniplink.fullname" . }}-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sniplink.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sniplink.fullname" . }}-config
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sniplink.fullname" . }}-secrets
                  key: RABBITMQ_URL
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sniplink.fullname" . }}-config
                  key: BASE_URL
          resources:
            {{- toYaml .Values.shortener.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.shortener.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.shortener.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sniplink.fullname" . }}-shortener
  labels:
    {{- include "sniplink.labels" . | nindent 4 }}
    app.kubernetes.io/component: shortener
spec:
  type: {{ .Values.shortener.service.type }}
  ports:
    - port: {{ .Values.shortener.service.port }}
      targetPort: {{ .Values.shortener.service.port }}
      name: http
  selector:
    app.kubernetes.io/name: {{ include "sniplink.name" . }}-shortener
{{- if .Values.shortener.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sniplink.fullname" . }}-shortener
  labels:
    {{- include "sniplink.labels" . | nindent 4 }}
    app.kubernetes.io/component: shortener
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sniplink.fullname" . }}-shortener
  minReplicas: {{ .Values.shortener.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.shortener.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.shortener.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.shortener.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.shortener.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.shortener.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
