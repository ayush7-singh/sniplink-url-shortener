apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener
  namespace: sniplink
  labels:
    app.kubernetes.io/name: shortener
    app.kubernetes.io/part-of: sniplink
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shortener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortener
        app.kubernetes.io/part-of: sniplink
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: shortener
          image: url-shortener-shortener:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: sniplink-config
                  key: PORT_SHORTENER
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sniplink-secrets
                  key: DATABASE_URL
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: sniplink-config
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: sniplink-config
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: sniplink-config
                  key: PGDATABASE
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: sniplink-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sniplink-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: sniplink-config
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: sniplink-secrets
                  key: RABBITMQ_URL
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: sniplink-config
                  key: BASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shortener-service
  namespace: sniplink
  labels:
    app.kubernetes.io/name: shortener
    app.kubernetes.io/part-of: sniplink
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app.kubernetes.io/name: shortener
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shortener-hpa
  namespace: sniplink
  labels:
    app.kubernetes.io/name: shortener
    app.kubernetes.io/part-of: sniplink
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shortener
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
